function facility(){return current==='all'?'All facilities':`Location ${String(current+1).padStart(2,'0')} · ${names[current]}`}function record(i){return data[i]}function unitCount(i){return i===6?308:142+(i*13)%48}function occupied(i){return i===6?154:Math.round(unitCount(i)*(.79+((i*7)%13)/100))}function currency(i){return i===6?9185.93:18900+i*1475}function stats(){if(current==='all'){let occ=names.reduce((a,_,i)=>a+occupied(i),0),units=names.reduce((a,_,i)=>a+unitCount(i),0);return [['Facilities','12','Across the TriStar portfolio','⌂'],['Occupied units',occ.toLocaleString(),`of ${units.toLocaleString()} total units`,'▤'],['Occupancy',Math.round(occ/units*100)+'%','Portfolio average','◉'],['Collected this month',money(names.reduce((a,_,i)=>a+currency(i),0)),'Across all locations','＄']]}let r=record(current),o=occupied(current),u=unitCount(current);return [['Occupied units',o,`of ${u} total units`,'▤'],['Occupancy',Math.round(o/u*100)+'%','Current facility','◉'],['Collected this month',money(currency(current)),'↑ 8.2% from last month','＄'],['Open auction cases',r.auctions.length,'Requires active follow-up','◇']]}
function renderView(){let v=$('#view');if(!v)return; if(page==='Overview')v.innerHTML=overview();else if(page==='Tenants')v.innerHTML=tenantPage();else if(page==='Units')v.innerHTML=unitsPage();else if(page==='Payments')v.innerHTML=paymentsPage();else if(page==='Auctions')v.innerHTML=auctionsPage();else if(page==='Account Notes')v.innerHTML=notesPage();else v.innerHTML=facilitiesPage();bindView()}
